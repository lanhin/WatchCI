# 示例项目 — 复制后修改。未启用；REPO_URL 需改成真实远程。

# —— 仓库 ——
# 项目名称 — 字母数字与下划线、短横线；通常与文件名一致。
NAME=example
# 启用 — 否时跳过该项目。
ENABLED=false
# 代码托管平台 — github / gitee / gitlab / gitcode。
PROVIDER=github
# Git 远程地址 — 用于 clone / fetch，必填。
REPO_URL=https://github.com/example/repo.git
# API 根地址 — 空则用平台默认（如 https://api.github.com）。
API_BASE=
# 仓库所有者 — 平台上的 owner/org；查 PR 等 API 时需要。
OWNER=example
# 仓库名 — 平台短名（非完整 URL）。
REPO=repo
# GitLab 项目 ID — 仅 GitLab 需要；其它平台留空。
PROJECT_ID=

# —— 监听 ——
# 监听分支 — 逗号分隔；空则按 main。推送与 PR 合入目标均按此过滤；PR 合入其 base 后再跑 SCRIPT（冲突即失败）。
BRANCHES=main
# 监听 PR/MR — 是否轮询拉取请求。
WATCH_PRS=true
# PR 标签过滤 — 仅 GitHub：逗号分隔；空表示不过滤。
PR_LABELS=

# —— 执行 ——
# CI 脚本 — 相对仓库根或绝对路径，可跟参数；路径勿含空格；必填。
# 示例：SCRIPT='./scripts/ci.example.sh --quick'
SCRIPT=./scripts/ci.example.sh
# 工作目录 — 相对克隆根；空则在克隆根执行。
WORKDIR=
# 超时（秒） — 空则用全局默认超时。
TIMEOUT_SEC=600
# 失败重试次数 — 空则用全局；0 不重试；默认 1，最大 8；失败后立刻原地再跑。
FAIL_RETRIES=
# 允许手动重跑失败 — 本机台是否可对失败/超时的 run 一键重跑。
ALLOW_MANUAL_RERUN=true
# 令牌环境变量名 — 如 GITHUB_TOKEN；存的是变量名，不是令牌本身。
TOKEN_ENV=GITHUB_TOKEN
# 回写 PR 评论 — 跑完后置顶更新一条结果评论（GitHub/Gitee/GitCode）。见 docs/pr-comment-setup.md。
POST_PR_COMMENT=false
# 成功评论则跳过 — 需同时开启回写评论：若 PR 上已有同 SHA 的 success 评论则跳过 CI（写入 skipped，可在现场强制重跑）。
SKIP_IF_PR_SUCCESS_COMMENT=false
# 每日补跑 — 到点后若当天目标分支尚无完成的 branch CI，则入队一次（不写 PR 评论）。
DAILY_ENABLE=false
# 每日补跑时刻 — 本机时区 HH:MM；到点后才考虑入队。
DAILY_AT=02:00
# 每日补跑分支 — 须能被 BRANCHES 匹配；默认 main。
DAILY_BRANCH=main
# 每日补跑脚本 — 仅 daily 事件用；空则用 SCRIPT。
DAILY_SCRIPT=

# —— 路径（高级） ——
# 克隆目录 — 空则 data/clones/<项目名>。
CLONE_DIR=
